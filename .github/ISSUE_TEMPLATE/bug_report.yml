name: Bug report
description: Something in FamilyOS does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems do not belong here: please report them privately (see SECURITY.md).
        Leave out personal data: names, addresses, documents, API keys, app keys and tokens.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or commit you run.
      placeholder: "0.1.0 or a commit sha"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it
      options:
        - Docker Compose
        - Docker (other)
        - From source (pnpm)
        - Other
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Server hardware
      placeholder: "Raspberry Pi 5, a NAS, a mini PC, …"
  - type: input
    id: client
    attributes:
      label: Device and browser
      placeholder: "iPhone, Safari, installed as an app; Firefox on a laptop; a wall display, …"
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Today
        - Calendar
        - Lists (tasks, shopping)
        - Quick add
        - Board
        - Chores or kitchen
        - Records (vehicles, pets, home)
        - Assistant or AI
        - MCP (own AI agent)
        - Notifications, Telegram or email
        - Family displays
        - Members, roles, sign-in or devices
        - Backups
        - Languages, region or appearance
        - Installation or upgrade
        - Other
  - type: dropdown
    id: ai
    attributes:
      label: AI provider (if it matters)
      options:
        - Not relevant
        - OpenRouter
        - Ollama
        - Other OpenAI-compatible
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs famos`, with secrets removed. FamilyOS never logs the contents of family documents.
      render: text
